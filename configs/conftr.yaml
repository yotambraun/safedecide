# Same as base + Conformal Training (Stutz et al., ICLR 2022) from 30% of training on.
run_name: safedecide-conftr
base_model: jhu-clsp/mmBERT-small
profile: clean
max_train_rows: null
typed_decisions_repeat: 4   # oversample the typed-decisions carve (the headline benchmark)
max_length: 384
max_pairs_per_batch: 96
grad_accum: 1
epochs: 2
lr: 5.0e-5
weight_decay: 0.01
warmup_ratio: 0.06
w_brier: 0.5
w_rps: 0.5
w_conftr: 0.1
conftr_alpha: 0.05
conftr_temperature: 0.1
conftr_start_frac: 0.3
eval_every: 500
val_max: 3000
seed: 42
