[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "safedecide"
version = "0.1.0"
description = "Small System One decision models with a guaranteed error rate on what they automate."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Yotam Braun" }]
keywords = ["decision-model", "systemone", "conformal-prediction", "calibration", "selective-prediction", "llm-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.4",
  "transformers>=4.48",
  "huggingface_hub>=0.23",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
data = ["datasets>=2.19"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
report = ["matplotlib>=3.8"]
all = ["safedecide[data,export,serve,report]"]

[project.scripts]
safedecide = "safedecide.cli:main"

[project.urls]
Homepage = "https://github.com/yotambraun/safedecide"
Source = "https://github.com/yotambraun/safedecide"
Issues = "https://github.com/yotambraun/safedecide/issues"
Changelog = "https://github.com/yotambraun/safedecide/blob/main/CHANGELOG.md"
Model = "https://huggingface.co/yotambr/safedecide-140m"

[dependency-groups]
dev = ["safedecide[all]", "pytest>=8", "ruff>=0.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/safedecide"]

[tool.hatch.build.targets.sdist]
# what a source install needs; notebooks, the Space, figures and scripts live on GitHub
only-include = ["src", "tests", "configs", "docs/METHOD.md", "README.md", "CHANGELOG.md", "CITATION.cff", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
  "e2e: end-to-end tests with a tiny model (slower)",
  "network: needs the Hugging Face Hub (skips when offline)",
]
